name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read mod version
        id: version
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          echo "mod_version=$VERSION" >> "$GITHUB_OUTPUT"

      # Build 1.20.1 (Fabric + Forge)
      - name: Build 1.20.1 (Fabric + Forge)
        env:
          WS_SERVER_URL: ${{ secrets.WS_SERVER_URL }}
        run: ./gradlew clean customBuild -Pminecraft_version=1.20.1 -PwsServerUrl="$WS_SERVER_URL"

      - name: Collect 1.20.1 jars
        run: |
          mkdir -p release
          VERSION=${{ steps.version.outputs.mod_version }}
          cp outputs/HuHoBot-${VERSION}-Fabric-1.20.1.jar "release/HuHoBot-${VERSION}-Fabric-1.20.1+.jar"
          cp outputs/HuHoBot-${VERSION}-Forge-1.20.1.jar "release/HuHoBot-${VERSION}-Forge-1.20.1-1.20.4.jar"
          

      # Build 1.20.4 (NeoForge)
      - name: Build 1.20.4 (Fabric + NeoForge)
        env:
          WS_SERVER_URL: ${{ secrets.WS_SERVER_URL }}
        run: ./gradlew clean customBuild -Pminecraft_version=1.20.4 -PwsServerUrl="$WS_SERVER_URL"

      - name: Collect 1.20.4 jars
        run: |
          VERSION=${{ steps.version.outputs.mod_version }}
          cp outputs/HuHoBot-${VERSION}-NeoForge-1.20.4.jar "release/HuHoBot-${VERSION}-NeoForge-1.20.4+.jar"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HuHoBot-${{ steps.version.outputs.mod_version }}
          path: release/
