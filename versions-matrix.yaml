  fabric_kotlin_version: "1.13.4+kotlin.2.2.0"
  fabric_minecraft_dependency: ">=1.20.1 <1.20.5"
  forge_minecraft_version_range: "[1.20.1,1.20.4)"
  jvm_version: "17"

