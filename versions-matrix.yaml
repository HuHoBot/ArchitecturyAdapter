# 版本矩阵配置文件
# 格式：
# minecraft_version:
#   forge_version: "forge版本" (仅1.20.3及以下需要)
#   neoforge_version: "neoforge版本" (仅1.20.4及以上需要)
#   architectury_version: "architectury版本"
#   kotlin_for_forge_version: "kotlin_for_forge版本"
#   fabric_loader_version: "fabric_loader版本"
#   fabric_api_version: "fabric_api版本"
#   fabric_kotlin_version: "fabric_kotlin版本"
#   enabled_platforms: "fabric,forge/neoforge" (可选，覆盖默认平台选择)
#   release_build: "true" (可选，作为发布兼容基线构建)
#   release_enabled_platforms: "fabric,forge/neoforge" (可选，仅发布基线构建时覆盖平台选择)
#   fabric_minecraft_dependency: "Fabric minecraft依赖范围" (可选)
#   forge_minecraft_version_range: "Forge mods.toml minecraft范围" (可选)
#   neoforge_minecraft_version_range: "NeoForge mods.toml minecraft范围" (可选)
#   mojang_mappings: "false" (可选，26.1+取消混淆时不再下载官方映射)
#   kotlin_jvm_target: "Kotlin字节码目标" (可选，Kotlin 2.2最高支持24)

1.20.1:
  release_build: "true"
  forge_version: "1.20.1-47.4.13"
  architectury_version: "9.2.14"
  kotlin_for_forge_version: "4.12.0"
  fabric_loader_version: "0.16.5"
  fabric_api_version: "0.92.9+1.20.1"
  fabric_kotlin_version: "1.13.4+kotlin.2.2.0"
  fabric_minecraft_dependency: ">=1.20.1 <=1.21.11"
  forge_minecraft_version_range: "[1.20.1,1.20.4)"
  jvm_version: "17"

1.20.4:
  release_build: "true"
  release_enabled_platforms: "neoforge"
  neoforge_version: "20.4.251"
  architectury_version: "11.1.17"
  kotlin_for_forge_version: "4.12.0"
  fabric_loader_version: "0.16.5"
  fabric_api_version: "0.97.3+1.20.4"
  fabric_kotlin_version: "1.13.4+kotlin.2.2.0"
  neoforge_minecraft_version_range: "[1.20.4,1.21.11]"
  jvm_version: "17"

26.1:
  release_build: "true"
  neoforge_version: "26.1.0.19-beta"
  architectury_version: "20.0.5"
  kotlin_for_forge_version: "6.2.0"
  fabric_loader_version: "0.18.5"
  fabric_api_version: "0.145.1+26.1"
  fabric_kotlin_version: "1.13.4+kotlin.2.2.0"
  fabric_minecraft_dependency: ">=26.1"
  neoforge_minecraft_version_range: ">=26.1"
  mojang_mappings: "false"
  jvm_version: "25"
  kotlin_jvm_target: "24"
